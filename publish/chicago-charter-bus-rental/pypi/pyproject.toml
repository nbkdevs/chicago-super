[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chicago-charter-bus-rental"
version = "1.0.0"
description = "Reference constants for Chicago Charter Bus Rental and group travel in Chicago."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Chicago Super Coach" }]
keywords = ["chicago", "charter bus", "group travel"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://chicagosupercoachbus.com/"
Documentation = "https://chicagosupercoachbus.com/"

[tool.setuptools.packages.find]
where = ["src"]
