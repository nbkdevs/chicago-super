name: travel_pal
description: "Travel Pal — visual travel scrapbook"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  go_router: ^16.2.1
  google_fonts: ^6.3.1
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  intl: ^0.20.2
  image_picker: ^1.2.0
  flutter_staggered_grid_view: ^0.7.0
  photo_view: ^0.15.0
  share_plus: ^11.1.0
  file_picker: ^10.3.3
  collection: ^1.19.1
  archive: ^4.0.7
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#F7F3EC"
  adaptive_icon_foreground: assets/brand/app_icon.png

flutter_native_splash:
  color: "#F7F3EC"
  image: assets/brand/splash_logo.png
  android_12:
    color: "#F7F3EC"
    image: assets/brand/splash_logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/sample/
    - assets/brand/
